name: release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write

jobs:
    release:
        name: release
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: CompeyDev/setup-rokit@v0.2.1
            - run: rojo build --output typed.rbxm
            - id: ver
              run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
            - uses: softprops/action-gh-release@v3
              with:
                  name: typed ${{ steps.ver.outputs.version }}
                  generate_release_notes: true
                  files: typed.rbxm
    publish-pesde:
        name: publish pesde
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: CompeyDev/setup-rokit@v0.2.1
            - run: pesde install
            - run: pesde auth login --token "${{ secrets.PESDE_TOKEN }}"
            - run: pesde publish --yes
