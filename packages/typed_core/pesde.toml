name = "metamethods/typed_core"
version = "0.1.0"
description = "core library for all typed packages"
authors = ["metamethods"]
repository = "https://github.com/metamethods/typed"
license = "MIT"
includes = [
  "pesde.toml",
  "README.md",
  "LICENSE",
  "lib/**/*.luau",
]

[target]
environment = "luau"
lib = "lib/init.luau"

[indices]
default = "https://github.com/pesde-pkg/index"
