name: publish

on:
  workflow_dispatch:
  release:
    types:
      - published

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: lumin-org/setup-pesde@v0.4.1
      - run: pesde install

      - name: Publish Pesde
        run: pesde auth login --token "${{ secrets.PESDE_TOKEN }}" && pesde publish --yes

      - uses: CompeyDev/setup-rokit@v0.2.1
      - name: Publish Wally
        run: wally login --token "${{ secrets.WALLY_TOKEN }}" && wally publish
