name: publish

on:
  workflow_dispatch:
  release:
    types:
      - published

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: CompeyDev/setup-rokit@v0.2.1
      - name: Install embr
        run: |
          curl -fsSL -o embr https://github.com/ember-luau/ember/releases/latest/download/embr-linux-x86_64
          chmod +x embr
          mkdir "$HOME/bin"
          cp embr "$HOME/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: embr install
      - run: lute scripts/publish.luau
