name: publish

on:
  workflow_dispatch:
  release:
    types:
      - published

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: CompeyDev/setup-rokit@v0.2.1
      - uses: lumin-org/setup-pesde@v0.4.1
      - run: pesde install
      - run: lute scripts/prepare.luau
      - run: pesde auth login --token "${{ secrets.PESDE_TOKEN }}" && pesde publish --yes
